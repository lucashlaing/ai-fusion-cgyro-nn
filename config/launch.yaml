project_name: ai-fusion-cgyro-nn
model:
  bal-abstracted-acq-eig: 
    command: >- 
      [](make download file=online-bal/model_final_checkpoint.pth; mkdir checkpoints; rm -rf online-bal/; mv online-bal/model_final_checkpoint.pth checkpoints/model_final_checkpoint.pth; make download file=tglf_sumf_data_major_minor_perturb_madcut_filter/; mv tglf_sumf_data_major_minor_perturb_madcut_filter data; mv data/train data/pool; mkdir data/train;) python src/bal_finetune.py finetune=True bal.acquisition_function=<acq_func>;
    gpu_count: 2
    memory: 128
    cpu_count: 16
    ephemeral_storage: 200
    hparam:
      _acq_func: 'eig'
run:
  model: [bal-abstracted-acq-eig]