project_name: ai-fusion-cgyro-nn
model:
  bal-train-test:
    command: >-
      [](git submodule add https://github.com/Rose-STL-Lab/Zihao-s-Toolbox.git src/toolbox; make download file=tglf_sumf_data_major_perturb/;) python src/train.py; s5cmd cp "<dump-dir>/*" s3://testlawrence/cgyro-nn-results/
    gpu_count: 1
    memory: 30
    cpu_count: 4
    ephemeral_storage: 200
dataset:
  initial-dataset:
    hparam:
      # Launch will automatically consider all combinations of hparam
      # hparam preceded by _ will NOT appear in the job name
      # If your hparam contain special characters, you must _ them
      _dump-dir: ["./initial-training-run"]
      _project: ["SR"]
      _cn: [SR]
      _asinh_accumulate: [True]
      _normalize_mse_loss: [False]
      _random_loss: [False]
run:
  dataset: [initial-dataset]
  model: [train-large-filtered-hyperparams]