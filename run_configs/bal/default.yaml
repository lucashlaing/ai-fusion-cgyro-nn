sampling_mode: offline # offline = random-from-pool (real fluxes, exact-hash lookup, no KNN); online = synthetic JSON generation + K=1 KNN + knn_max_std filter
initial_training_size: 20000 # offline: real target (no KNN survival). online assumed ~30% survival -> 90000.
acquisition_function: random # in [random, eig, eig_stratified, direct, res_uni_ran, res_uni_pflip, strat_uni_ran, strat_uni_pflip, strat_eig_pflip, glo_uni_ow, strat_rank_ow]
n_samples: 200000
new_sample_size: 10000 # offline: ~= actual acquired/iter (only dup drop, no ~0.33 KNN survival)
entropy_training_steps: 100
model_count: 16
dist_json_path: './src/utils/mean_std_with_rho.json'
knn_max_std: 1.63 # KNN drop threshold = per-feature max (L-inf) delta to nearest real point, JSON-std units
has_spectra: True
iterations: 10
num_classes: 3
num_strata: 3
strata_weights: [0.5, 0.3, 0.2]
continuous_retrain: false # true = warm-start each BAL iter from prev weights (continual); false = reset to baseline (train-from-scratch)

# Checkpointing and resume
resume: false
resume_path: ""
checkpoint_enable: true
checkpoint_local_root: "./latest_res/bal_checkpoints"
checkpoint_s3_uri: "offline_checkpoints/"
