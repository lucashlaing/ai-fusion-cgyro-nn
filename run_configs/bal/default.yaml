initial_training_size: 90000 # accounting for 30% survival rate
acquisition_function: random # in [random, eig, direct, eig_stratified, gaussian, custom]
n_samples: 200000
new_sample_size: 10000
entropy_training_steps: 100
model_count: 16
dist_json_path: './src/utils/mean_std_with_rho.json'
knn_max_std: 1.63 # KNN drop threshold = per-feature max (L-inf) delta to nearest real point, JSON-std units
has_spectra: True
iterations: 10
num_classes: 3
num_strata: 3
strata_weights: [0.5, 0.3, 0.2]

# Checkpointing and resume
resume: false
resume_path: ""
checkpoint_enable: true
checkpoint_local_root: "./latest_res/bal_checkpoints"
checkpoint_s3_uri: "offline_checkpoints/"
