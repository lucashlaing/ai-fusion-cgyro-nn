defaults:
  - bal: default
  - dataset: SR_full_madcut
  - model: SR
  - opt: SR
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

project: SR
board: True
plot: True
experiment: "SR"
dump_dir: "./latest_res"
checkpoint_path: src/utils/700000_params.pth
base_seed: 42
dataset_workers: 2
batch: 1
restore_dir: "./SR-res"
restore_step: 100
epochs: 20
steps_per_epoch: 1
loss_freq: 1
save_freq: 1
plot_freq: 35
time_freq: 350
time_warm: 3
# accumulation is for getting the mean and standard deviation of inputs/targets in model
# set the steps to cover approximately 1 epoch
accumulation_steps: 1
time_stamp: ""
resume_index: 0

full_eval: False

# only to disable hydra's logging, ignore below
hydra:  
  output_subdir: null
  run:  
    dir: .