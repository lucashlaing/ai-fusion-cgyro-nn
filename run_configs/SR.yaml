defaults:
  - bal: default
  - dataset: SiNN_local
  - model: CGYRO
  - opt: SR
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

project: SR
board: True
plot: False
dump_dir: "./latest_res"
checkpoint_path: "./checkpoints/model_final_checkpoint.pth"
finetune: False
base_seed: 42
dataset_workers: 1
batch: 4096
epochs: 200
steps_per_epoch: 875
loss_freq: 1000
save_freq: 10000
plot_freq: 35
time_freq: 3500
time_warm: 350
# accumulation is for getting the mean and standard deviation of inputs/targets in model
# set the steps to cover approximately 1 epoch
accumulation_steps: 1

# only to disable hydra's logging, ignore below
hydra:  
  output_subdir: null
  run:  
    dir: .