defaults:
  - bal: default
  - dataset: SR_full_madcut
  - model: SR
  - opt: SR
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

project: SR
board: True
plot: True
experiment: "SR"
dump_dir: "./latest_res"
base_seed: 42
dataset_workers: 8
batch: 4096
restore_dir: "./SR-res"
restore_step: 1000000
epochs: 200
steps_per_epoch: 875
loss_freq: 1000
save_freq: 10000
plot_freq: 35000
time_freq: 3500
time_warm: 350
# accumulation is for getting the mean and standard deviation of inputs/targets in model
# set the steps to cover approximately 1 epoch
accumulation_steps: 3500
time_stamp: ""
resume_index: 0

full_eval: False

# only to disable hydra's logging, ignore below
hydra:  
  output_subdir: null
  run:  
    dir: .