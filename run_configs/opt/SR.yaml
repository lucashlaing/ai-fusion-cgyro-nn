peak_lr: 5e-5                   # lower to be safe on small data
end_lr: 1e-6
warmup_steps: 0                # no warmup needed
decay_steps: 40                # total steps = 2 * 20 = 40
gnorm_clip: 1.0
weight_decay: 0.0              # TURN OFF for small data
gradient_accumulation_steps: 5  # simulate batch of 5
random_loss: False             # for stability