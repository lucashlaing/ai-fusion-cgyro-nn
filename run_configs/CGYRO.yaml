defaults:
  - bal: default
  - dataset: SR_full_madcut
  - model: CGYRO
  - opt: CGYRO
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

project: CGYRO
board: False
plot: False
dump_dir: "./latest_res"
checkpoint_path: "./checkpoints/model_final_checkpoint.pth"
new_checkpoint_path: "./checkpoints/new_model_checkpoint.pth"
h5_candidate_path: "./candidates.h5"
tglf_candidate_path: "./tglf_candidates/"
cgyro_candidate_path: "./cgyro_candidates/"
base_seed: 42
dataset_workers: 1
batch: 256
epochs: 10
steps_per_epoch: 10
loss_freq: 100
save_freq: 500
plot_freq: 10
time_freq: 500
time_warm: 20
# accumulation is for getting the mean and standard deviation of inputs/targets in model
# set the steps to cover approximately 1 epoch
accumulation_steps: 5

# only to disable hydra's logging, ignore below
hydra:  
  output_subdir: null
  run:  
    dir: .