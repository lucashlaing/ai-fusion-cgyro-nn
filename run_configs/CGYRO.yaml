defaults:
  - bal: default
  - dataset: SR_full_madcut
  - model: CGYRO
  - opt: SR
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

project: CGYRO
board: True
plot: True
experiment: "SR"
dump_dir: "./latest_res"
base_seed: 42
dataset_workers: 2
batch: 256
restore_dir: "./SR-res"
restore_step: 100
epochs: 20
steps_per_epoch: 80
loss_freq: 100
save_freq: 1000
plot_freq: 3500
time_freq: 3500
time_warm: 350
# accumulation is for getting the mean and standard deviation of inputs/targets in model
# set the steps to cover approximately 1 epoch
accumulation_steps: 1
time_stamp: ""
resume_index: 0

full_eval: False

# only to disable hydra's logging, ignore below
hydra:  
  output_subdir: null
  run:  
    dir: .